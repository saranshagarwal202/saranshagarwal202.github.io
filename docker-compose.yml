version: '3.8'

services:
  dev:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm start
    environment:
      - CHOKIDAR_USEPOLLING=true

  build:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run build